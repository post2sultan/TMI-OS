name: tmi-platform

services:

  postgres:
    image: postgres:17
    container_name: tmi-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - ../data/postgres:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: tmi-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ../data/ollama:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tmi-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ../data/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: tmi-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    container_name: tmi-searxng
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=TMI Search
      - AUTOCOMPLETE=duckduckgo

    volumes:
      - ../data/searxng:/etc/searxng

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: tmi-backend
    restart: unless-stopped

    env_file:
      - ../backend/.env

    depends_on:
      - postgres
      - ollama
      - redis
      - qdrant

    ports:
      - "8000:8000"

    volumes:
      - ../backend:/app
      - ../prompts:/prompts